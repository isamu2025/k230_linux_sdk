name: Build 01Studio K230 Debian Desktop Image

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Target Board'
        required: true
        default: 'canmv'
        type: choice
        options:
          - canmv
          - cybercam
      os_ver:
        description: 'Debian Version'
        required: true
        default: 'debian13'
        type: choice
        options:
          - debian13
          - debian12
      rootfs_type:
        description: 'System Type'
        required: true
        default: 'desktop'
        type: choice
        options:
          - desktop
          - server

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Maximize Build Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          sudo apt-get clean
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout walnutpi-build
        uses: actions/checkout@v4
        with:
          repository: walnutpi/walnutpi-build
          ref: main
          fetch-depth: 1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y whiptail bc pigz debootstrap qemu-user-static binfmt-support \
            kpartx parted dosfstools u-boot-tools device-tree-compiler \
            gcc-arm-none-eabi cmake debian-archive-keyring curl git bison flex swig \
            libssl-dev python3 python3-dev

      - name: Run Build Script
        run: |
          set -e
          echo "Starting robust step-by-step build for Board: ${{ inputs.board }}, OS: ${{ inputs.os_ver }}, Type: ${{ inputs.rootfs_type }}"

          # 1. 升级 canmv 交叉工具链至平头哥玄铁 V3.0.2（彻底解决 Linux 6.6 内核 vector.h 中 .option arch,+v 与向量指令报错问题）
          sed -i 's|TOOLCHAIN_DOWN_URL=.*|TOOLCHAIN_DOWN_URL="https://download.kendryte.com/k230/downloads/dl/gcc/Xuantie-900-gcc-linux-6.6.0-glibc-x86_64-V3.0.2-20250410.tar.gz"|g' board/canmv/board.conf
          sed -i 's|TOOLCHAIN_FILE_NAME=.*|TOOLCHAIN_FILE_NAME="Xuantie-900-gcc-linux-6.6.0-glibc-x86_64-V3.0.2"|g' board/canmv/board.conf

          # 2. 修复 upstream walnutpi-build 已知的脚本变量污染与语法缺陷
          sed -i 's/readonly IMAGE_FLAG_NO_SCREEN_DISPLAY/IMAGE_FLAG_NO_SCREEN_DISPLAY/g' scripts/image/build.sh || true
          sed -i 's/readonly PART1_SIZE/PART1_SIZE/g' scripts/image/build.sh || true
          sed -i 's/\[ -n "\$ENTER_img_file" \]/\[ -f "\$ENTER_img_file" \]/g' scripts/image/__make_prepare.sh || true
          sed -i 's/local VERSION_APT=.*/local VERSION_APT="1.0.0"/g' scripts/image/__make_image.sh || true
          sed -i 's/overlays=spidev0_0 spidev0_1 csi2/overlays="spidev0_0 spidev0_1 csi2"/g' board/canmv/config.txt || true

          # 3. 独立进程串行构建，彻底规避 source 导致的局部/全局变量冲突
          echo "=== [1/4] Building Bootloader (U-Boot) ==="
          sudo bash ./scripts/boot/build.sh ${{ inputs.board }}

          echo "=== [2/4] Building Linux Kernel ==="
          sudo bash ./scripts/kernel/build.sh ${{ inputs.board }}

          echo "=== [3/4] Building Rootfs (Debian Desktop) ==="
          sudo bash ./scripts/rootfs/build.sh ${{ inputs.board }} ${{ inputs.os_ver }} ${{ inputs.rootfs_type }}

          echo "=== [4/4] Assembling Final SD Card Image ==="
          sudo bash ./scripts/image/build.sh ${{ inputs.board }} ${{ inputs.os_ver }} ${{ inputs.rootfs_type }}

      - name: Compress Image and Generate Checksums
        id: pack
        run: |
          sudo chown -R $USER:$USER output/
          echo "=== Listing Output Images ==="
          ls -lh output/ || true
          ls -lh output/${{ inputs.board }}/ || true
          
          IMG_FILE=$(find output/ -maxdepth 3 -type f -name "*.img" | head -n 1)
          if [ -z "$IMG_FILE" ]; then
            echo "Error: No .img file found in output/"
            exit 1
          fi
          
          echo "Found image: $IMG_FILE"
          DIRNAME=$(dirname "$IMG_FILE")
          BASENAME=$(basename "$IMG_FILE")
          
          cd "$DIRNAME"
          echo "Compressing with pigz..."
          pigz -k -9 "$BASENAME"
          
          GZ_NAME="${BASENAME}.gz"
          echo "Generating checksums for $GZ_NAME..."
          md5sum "$GZ_NAME" > "${GZ_NAME}.md5"
          sha256sum "$GZ_NAME" > "${GZ_NAME}.sha256"
          
          echo "RELEASE_PATH=$DIRNAME" >> $GITHUB_ENV
          echo "GZ_NAME=$GZ_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=k230-${{ inputs.board }}-${{ inputs.os_ver }}-${{ inputs.rootfs_type }}-$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GZ_NAME }}
          path: |
            ${{ env.RELEASE_PATH }}/*.img.gz
            ${{ env.RELEASE_PATH }}/*.md5
            ${{ env.RELEASE_PATH }}/*.sha256
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "01Studio K230 (${{ inputs.board }}) ${{ inputs.os_ver }} Desktop Release"
          body: |
            ## 01Studio K230 Linux-Debian 13 图形桌面版固件发布
            - **板型 (Board)**: ${{ inputs.board }} (01Studio CanMV-K230)
            - **系统形态**: ${{ inputs.rootfs_type }} (XFCE4 图形桌面版)
            - **Debian 版本**: ${{ inputs.os_ver }} (Trixie riscv64)
            - **Linux 内核**: 平头哥玄铁优化版 Linux 6.6 LTS
            - **特色功能**:
              - 预装 XFCE4 经典轻量级桌面环境 + LightDM 登录器
              - 预装文泉驿正黑中文字体 (`fonts-wqy-zenhei`)
              - 预装 NetworkManager 图形化 WiFi 管理器（可直接点选连接 WiFi）
              - 预装 X11VNC 远程桌面支持（电脑可通过 VNC 远程直连板端桌面）
            - **构建时间**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          files: |
            ${{ env.RELEASE_PATH }}/*.img.gz
            ${{ env.RELEASE_PATH }}/*.md5
            ${{ env.RELEASE_PATH }}/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
